    sensitivity = -0.7
}
device { # mx vertical, wired mode
    name = logitech-mx-vertical-advanced-ergonomic-mouse-2
    sensitivity = -0.7
}
device { # mx vertical, wired mode
    name = logitech-mx-vertical-advanced-ergonomic-mouse-3
    sensitivity = -0.7
}


gestures {
    workspace_swipe_invert = true
    workspace_swipe_forever = false
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_distance = 300
    workspace_swipe_use_r = true
    workspace_swipe_cancel_ratio = 0.1
    workspace_swipe_direction_lock = false
}

gesture = 3, horizontal, workspace

general {
    gaps_in = 5
    gaps_out = 5,10,10,10 # ironbar takes 5px for it's shadow
    border_size = 0 # 2
    col.active_border = rgba(00000000) # rgba(7daea3ff) rgba(00000000) rgba(d3869bff) 35deg
    col.inactive_border = rgba(00000000)

    layout = dwindle # hy3
}

binds {
    focus_preferred_method = 1
    scroll_event_delay = 1
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    enable_swallow = true
    vrr = 1
    focus_on_activate = true
    mouse_move_focuses_monitor = true
    #swallow_regex = ^(kitty)$ #not working?
    #swallow_regex = ^(wezterm)$ #not working?

    disable_autoreload = false
}

debug {
    disable_logs = false
}

decoration {
    blur {
        enabled = true
        special = false
        new_optimizations = true
        size = 14
        passes = 3
        brightness = 1
        noise = 0.01
        contrast = 1
        popups = true
        popups_ignorealpha = 0.6
        # input_methods = true
        # input_methods_ignorealpha = 0.8
    }
    
    shadow {
        enabled = true
        range = 30
        offset = 0 2
        render_power = 4
        color = rgba(00000020)
    }
    # blur {
    #     enabled = true
    #     size = 5
    #     passes = 4 # is 4 too expensive?
    #     new_optimizations = true
    # }
    rounding = 0 # 10
}

animations {
    enabled = true

    # quickened animations:
    animation = workspaces, 1, 8, default
    animation = windows, 1, 5, default

    # remove opacity fadein/out
    animation = fadeIn, 0, 5, default
    #animation = fadeOut, 0, 5, default

    # remove initial border animation
    animation = borderangle, 0, 10, default

}

dwindle {
    preserve_split = true # you probably want this
}

xwayland {
    force_zero_scaling = true
    use_nearest_neighbor = true
}

plugin {
    hyprsplit {
        num_workspaces = 10
    }
    # hy3 {
    #     autotile {
    #         enable = true
    #         trigger_width = 800
    #         trigger_height = 500
    #     }
    # }
}

# Change fullscreen/pinned border color
windowrule = border_color rgba(ea6962ff) rgba(d3869bff) 45deg, match:fullscreen 1
windowrule = border_color rgba(ea6962ff) rgba(d3869bff) 45deg, match:pin 1
windowrule = border_size 1, match:fullscreen 1
windowrule = border_size 1, match:pin 1

# Floating and centered dialogs
windowrule = float on, match:class ^(xdg-desktop-portal)(.*)$
windowrule = float on, match:title ^(Open Folder)$
windowrule = float on, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float on, match:title ^(Firefox — Sharing Indicator)$
windowrule = suppress_event fullscreen, match:title ^(Firefox — Sharing Indicator)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = size 500 300, match:title ^(Picture-in-Picture)$ # firefox PiP window
windowrule = float on, match:title ^(Open File)(.*)$
windowrule = float on, match:title ^(Open Folder)(.*)$
windowrule = float on, match:title ^(Select a File)(.*)$
windowrule = float on, match:title ^(Save As)(.*)$
windowrule = float on, match:title ^(Library)(.*)$
windowrule = float on, match:class ^(com.gabm.satty)$
windowrule = float on, size 1100 700, move (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5)), match:class ^(thunar)$
windowrule = float on, size 1100 700, move (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5)), match:class ^(org.kde.dolphin)$
windowrule = suppress_event fullscreen, match:title ^(Extension: (Bitwarden - Free Password Manager) - — Mozilla Firefox)$
windowrule = suppress_event fullscreen, match:title ^(Extension: (Bitwarden - Free Password Manager) - Bitwarden — Mozilla Firefox)$
windowrule = float on, match:title ^(Extension: (Bitwarden - Free Password Manager) - — Mozilla Firefox)$
windowrule = float on, match:title ^(Extension: (Bitwarden - Free Password Manager) - Bitwarden — Mozilla Firefox)$
windowrule = float on, size 1000 600, move (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5)), match:title ^(Ghostty Floating)$

# idle inhibit while watching videos
windowrule = idle_inhibit focus, match:class ^(mpv|.+exe)$
windowrule = idle_inhibit focus, match:class ^(firefox)$, match:title ^(.*YouTube.*)$ # I think this has false positives?


# Blur some layers (wlr-layer-shell)
layerrule = blur on, blur_popups on, match:namespace notifications
layerrule = ignore_alpha 0.6, match:namespace notifications
layerrule = blur on, blur_popups on, match:namespace ironbar
layerrule = ignore_alpha 0.8, match:namespace ironbar

# Application keybinds
bind = SUPER, Q, exec, ghostty +new-window
bind = SUPER SHIFT, Q, exec, ghostty +new-window --title="Ghostty Floating"
bind = SUPER, E, exec, thunar
bind = SUPER, W, exec, app2unit -s a -- firefox
bind = SUPER, Space, exec, fuzzel --launch-prefix='app2unit --fuzzel-compat -s a --'

# Media keys (for all bind flags: https://wiki.hyprland.org/Configuring/Binds/)
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ -l 1.0
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause # we use play-pause cuz QMK config uses AudioPlay only
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioNext, exec, playerctl next
binde = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bind = , Print, exec, ~/.local/bin/screenshot
bind = CONTROL, Print, exec, ~/.local/bin/screenshotFull
bindl = ALT, F5, exec, playerctl previous
bindl = ALT, F6, exec, playerctl next
bindl = ALT, F7, exec, playerctl play-pause

# Global hotkeys
bind = , F12, pass, ^(com\.obsproject\.Studio)$

# # Zoom into screen
# # SUPER + SHIFT + [ scroll wheel ]
# bind = SUPER SHIFT, mouse_up, exec, 
# bind = SUPER SHIFT, mouse_down, exec, 
bind = SUPER SHIFT, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
bind = SUPER SHIFT, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
bind = SUPER, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = SUPER, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor 1

# Hyprland functions
bind = SUPER, D, killactive
bind = SUPER, V, togglefloating
bind = SUPER SHIFT, P, pin
bind = SUPER, X, layoutmsg, togglesplit # for dwindle layout
bind = SUPER, F, fullscreen, 1
bind = SUPER SHIFT, F, fullscreen, 0
bind = SUPER CONTROL ALT, Backspace, exit
bind = SUPER, T, workspace, empty # alternate keybind to SUPER SHIFT K

# Switch to workspace (using split-monitor-workspaces)
# SUPER + [ 0-9 ]
bind = SUPER, 1, split:workspace, 1
bind = SUPER, 2, split:workspace, 2
bind = SUPER, 3, split:workspace, 3
bind = SUPER, 4, split:workspace, 4
bind = SUPER, 5, split:workspace, 5
bind = SUPER, 6, split:workspace, 6
bind = SUPER, 7, split:workspace, 7
bind = SUPER, 8, split:workspace, 8
bind = SUPER, 9, split:workspace, 9
bind = SUPER, 0, split:workspace, 10

# Move active window to workspace (using split-monitor-workspaces) 
# SUPER + SHIFT + [ 0-9 ]
bind = SUPER SHIFT, 1, split:movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, split:movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, split:movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, split:movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, split:movetoworkspacesilent, 5
bind = SUPER SHIFT, 6, split:movetoworkspacesilent, 6
bind = SUPER SHIFT, 7, split:movetoworkspacesilent, 7
bind = SUPER SHIFT, 8, split:movetoworkspacesilent, 8
bind = SUPER SHIFT, 9, split:movetoworkspacesilent, 9
bind = SUPER SHIFT, 0, split:movetoworkspacesilent, 10

# Move window in direction
# SUPER + CONTROL + [ vim keys ]
bind = SUPER CONTROL, H, movewindow, l
bind = SUPER CONTROL, J, movewindow, d
bind = SUPER CONTROL, K, movewindow, u
bind = SUPER CONTROL, L, movewindow, r

# Move window focus 
# SUPER + [ vim keys ]
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Scroll through existing workspaces (includes first empty and previous workspace)
# SUPER + SHIFT + [ mouse buttons / vim keys ]
bind = SUPER SHIFT, mouse:273, workspace, r+1
bind = SUPER SHIFT, mouse:272, workspace, r-1
bind = SUPER SHIFT, L, workspace, r+1
bind = SUPER SHIFT, H, workspace, r-1
bind = SUPER SHIFT, K, workspace, empty
bind = SUPER SHIFT, J, workspace, previous

# Focus monitor 
# SUPER + CONTROL + [ scroll wheel / mouse buttons / vim keys ] 
bind = SUPER SHIFT CONTROL, mouse:273, focusmonitor, r
bind = SUPER SHIFT CONTROL, mouse:272, focusmonitor, l
bind = SUPER SHIFT CONTROL, L, focusmonitor, r
bind = SUPER SHIFT CONTROL, H, focusmonitor, l

# Move/resize windows
# SUPER + mouse buttons and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow


