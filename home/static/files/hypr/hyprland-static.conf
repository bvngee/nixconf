input {
    kb_layout = us,us
    kb_variant = ,intl
    kb_options = grp:alts_toggle
    kb_model =
    kb_rules =

    numlock_by_default = false

    repeat_rate = 25
    repeat_delay = 300

    follow_mouse = 1
    mouse_refocus = false

    touchpad {
        # default to false, enable for trackpads
        disable_while_typing = false

        # scroll_factor = 0.5
    }

    # -1.0 to 1.0; 0 means no modification.
    sensitivity = -0.10 # decent default
}
device { # dell precision-old trackpad
    name = dll07b0:01-044e:120b
    disable_while_typing = true
}
device {
    name = ven_0488:00-0488:1063-touchpad
    disable_while_typing = true
}
device {
    name = glorious-model-o-wireless
    sensitivity = -0.25
}
device {
    name = glorious-model-o-wireless-1
    sensitivity = -0.25
}

device { # tiny old logitech wireless mouse
    name = logitech-m215-2nd-gen
    sensitivity = -0.85
}
device { # random old logitech wireless mouse
    name = logitech-m510
    sensitivity = -0.7
}

device { # mx vertical, wireless mode
    name = logitech-mx-vertical-1
    sensitivity = -0.7
}
